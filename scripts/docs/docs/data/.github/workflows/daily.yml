name: Daily Card Offer Report

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 pyyaml lxml

      - run: python scripts/collect_offers.py

      - run: |
          git config user.name "card-offer-bot"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update daily card offer report"
          git push
