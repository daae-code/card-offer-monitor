<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>카드 오퍼 리포트</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 24px;
      background: #f7f8fa;
      color: #16181d;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    input {
      padding: 10px;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      border: 1px solid #ccd1d8;
      border-radius: 8px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }

    .meta {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }

    a {
      color: #0b57d0;
    }
  </style>
</head>
<body>
  <header>
    <h1>카드 오퍼 리포트</h1>
    <p id="date">불러오는 중...</p>
    <input id="q" placeholder="카드사/플랫폼 검색" />
  </header>

  <main id="list"></main>

  <script>
    let all = [];

    async function load() {
      const res = await fetch("./data/latest.json?ts=" + Date.now());
      const data = await res.json();

      document.getElementById("date").textContent = "최근 업데이트: " + data.date;
      all = data.offers;
      render();
    }

    function render() {
      const q = document.getElementById("q").value.trim();
      const list = all.filter(o => !q || (o.company + o.platform).includes(q));

      document.getElementById("list").innerHTML = list.map(o => `
        <section class="card">
          <h2>${o.company}</h2>
          <div class="meta">${o.platform} · ${o.status}</div>
          <ul>${o.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
          <a href="${o.url}" target="_blank">원문 보기</a>
        </section>
      `).join("");
    }

    document.getElementById("q").addEventListener("input", render);
    load();
  </script>
</body>
</html>
